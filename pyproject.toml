[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-like-decision-tuning"
version = "0.1.0"
description = "Experiments in option-based decision tuning with Qwen and LoRA"
requires-python = ">=3.10"
dependencies = ["datasets>=2.14,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
